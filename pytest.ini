[pytest]
# ---------------------------------------------------------------------------
# The repository root contains interactive scripts named test_*.py
# (test_demo.py, test_gui.py, test_workflow.py, ...).  They are MANUAL
# scripts: they download from YouTube, spawn ffmpeg or open a customtkinter
# window at import time.  They are NOT unit tests and collecting them hangs
# or breaks the run.
#
# `testpaths = tests` pins collection to the real unit-test suite in tests/.
# ---------------------------------------------------------------------------
testpaths = tests

# Keep collection away from virtualenvs, build artefacts and VCS metadata.
norecursedirs = .git .* build dist CVS node_modules venv {arch} __pycache__ .ruff_cache .pytest_cache
